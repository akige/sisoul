[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
verbosity = 2
gas_reports = ["*"]
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.ci]
verbosity = 4
fuzz = { runs = 1000 }

# Optimism Sepolia / Arbitrum Sepolia / Base Sepolia / zkSync Sepolia
[rpc_endpoints]
optimism_sepolia = "https://sepolia.optimism.io"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
base_sepolia = "https://sepolia.base.org"
zksync_sepolia = "https://sepolia.era.zksync.dev"

[etherscan]
optimism_sepolia = { key = "${ETHERSCAN_KEY}", chain = 11155420 }
arbitrum_sepolia = { key = "${ETHERSCAN_KEY}", chain = 421614 }
base_sepolia = { key = "${ETHERSCAN_KEY}", chain = 84532 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

# remappings: 用户先 `forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-commit`
# OZ 5.x 提供 Governor / TimelockController / ERC20Votes 全套.
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
