[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sisoul"
version = "1.0.0-alpha"
description = "Decentralized P2P AI agent protocol (did:key + kubo IPFS + Signal chat + sigstore release). Your AI agent, your data, your friends, no cloud."
authors = [{ name = "sisoul maintainers" }]
maintainers = [{ name = "sisoul maintainers" }]
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = [
    "p2p", "decentralized", "ai-agent", "ipfs", "did", "self-sovereign-identity",
    "signal-protocol", "post-quantum", "pqxdh", "double-ratchet",
    "case-based-reasoning", "lora", "federated-learning", "multi-agent-debate",
    "eas", "ethereum-attestation", "optimism", "sigstore",
    "kubo", "libp2p", "gossipsub", "mdns",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pynacl>=1.5",
    "python-frontmatter>=1.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "zeroconf>=0.130",
    "qrcode[pil]>=7.4",
    "DoubleRatchet>=1.3",
]

[project.urls]
Homepage = "https://github.com/sisoul/sisoul"
Documentation = "https://github.com/sisoul/sisoul/tree/main/docs"
Repository = "https://github.com/sisoul/sisoul"
Issues = "https://github.com/sisoul/sisoul/issues"
Changelog = "https://github.com/sisoul/sisoul/blob/main/CHANGELOG.md"
PWA = "https://sisoul.github.io/sisoul-pwa/"
Whitepaper = "https://github.com/sisoul/sisoul/blob/main/docs/whitepaper/sisoul-whitepaper-v1.0.md"

[project.optional-dependencies]
# P2-G chat: post-quantum hybrid handshake (ML-KEM-1024).
# Resolution order: liboqs-python (needs cmake) -> kyber-py -> shim.
# kyber-py is pure Python, always installable.
chat = [
    "kyber-py>=1.2",
    # "liboqs-python>=0.15",  # opt-in; requires cmake + liboqs C lib
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",  # 波 4 dev-A (P2P async tests)
    "ruff>=0.4",
    "mypy>=1.8",
]
daemon = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
llm = [
    "anthropic>=0.30",
    "openai>=1.30",
    "google-generativeai>=0.5",
    "ollama>=0.2",
]
# macOS menu-bar tray (tools/menubar/sisoul_tray.py + dist/Sisoul.app)
# py2app only needed at build time, runtime is rumps + pyobjc.
menubar = [
    "rumps>=0.4",
    "pyobjc-framework-Cocoa>=10",
    "py2app>=0.28; platform_system == 'Darwin'",
]
crypto = [
    "pynacl>=1.5",
    "mnemonic>=0.20",
    # W21-W22 dev-B (DID + ENS subdomain + Privy social recovery)
    "web3>=6.0",
    "eth-account>=0.10",
    "eth-utils>=4.0",
]
# Phase 3 W41-W43 onchain (EAS + Arweave snapshot)
# dev-B 集成时 merge web3 / eas-sdk-py (dev-B 已在 crypto group 装过, 此处复列方便单装 onchain)
onchain = [
    "web3>=6.0",                     # dev-B 已加 (crypto group 复列, 单装 onchain 也能用)
    "arweave-python-client>=1.0",    # dev-C (W41-W43) · 真上链 optional, 不装 fallback fake tx_id
    # dev-B W37-W40 (EAS attestation queue, Optimism Sepolia testnet, batched 10/批)
    "eth-account>=0.10",             # sign batch tx (Phase 5 真发 tx 时用; 本 wave readonly)
    "eth-abi>=5.0",                  # encode attestation data 按 EAS schema (本 wave 用 JSON 占位)
    # "eas-sdk-py>=0.1",             # 官方 Python SDK 尚未 release, 自写 tx 构造已就绪
]
# Phase 3 W31-W36 · 波 4 dev-A (跨设备 libp2p P2P sync + WebRTC fallback)
# 注: py-libp2p (PyPI 名 'libp2p') 当前 protobuf 6.x gencode vs 5.x runtime 不兼容,
#     import 即 raise. transport.py 自动 fallback aiortc WebRTC. 装失败不 block (optional group).
# TODO: libp2p 库 protobuf 兼容修复后 transport.LibP2PTransport.send/recv 走真路径.
p2p = [
    "aiortc>=1.6",         # WebRTC fallback (实测主路径, aiortc==1.14 ok)
    "zeroconf>=0.130",     # mDNS local network discovery
    # "libp2p>=0.2",       # py-libp2p; 当前 protobuf 冲突, disabled. transport.py 自动 fallback aiortc.
]

[project.scripts]
sisoul = "sisoul.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sisoul"]

[tool.pytest.ini_options]
# 波 7 dev-A bug-3 修复: testpaths 加 "qa", 默认 `pytest` 自动跑 tests + qa.
# qa-D/qa-E/qa-C 三波报告均反映: CI / 主集成不知 qa 在哪导致漏跑.
testpaths = ["tests", "qa"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
