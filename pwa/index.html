<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="sisoul · 去中心化 AI 工作元层 dashboard" />
    <!-- HTML 不缓存, chunk hash 自带 cache-bust. 防止 user 看到旧 HTML 引旧 chunk. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />

    <!-- iOS PWA full screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="sisoul" />

    <title>sisoul · dashboard</title>
  </head>
  <body class="bg-sisoul-bg text-sisoul-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // alpha: 禁 service worker + 强卸旧 SW + 清 cache.
      // 之前 /sw.js (404 路径错) 被部分 user 缓存, 命中后 intercept 所有
      // 请求 → 黑屏. 这段代码强卸所有已注册 SW + 删 cache, 让 page 真显示.
      // v1.0 stable 再加 PWA 离线 (那时路径用 import.meta.env.BASE_URL 拼).
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        }).catch(function () {});
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          }).catch(function () {});
        }
      }
    </script>
  </body>
</html>
