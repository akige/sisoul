# sisoul docker-compose — local dev + Grafana monitoring stack.
# Use: docker compose up
# Access: http://localhost:9876/sisoul/health  + http://localhost:3000 (Grafana, admin/admin)
version: "3.9"

services:
  sisoul:
    build: .
    image: sisoul:alpha
    container_name: sisoul-daemon
    restart: unless-stopped
    ports:
      - "9876:9876"
    volumes:
      - sisoul-vault:/home/sisoul/.sisoul
    environment:
      - SISOUL_DAEMON_PORT=9876
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9876/sisoul/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: sisoul-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus-alerts.yml:/etc/prometheus/rules/sisoul-alerts.yml:ro
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    depends_on:
      - sisoul

  grafana:
    image: grafana/grafana:latest
    container_name: sisoul-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana-dashboard.json:/var/lib/grafana/dashboards/sisoul.json:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

volumes:
  sisoul-vault:
  prometheus-data:
  grafana-data:
