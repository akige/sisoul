[package]
name = "sisoul-client"
version = "0.1.0"
edition = "2021"
description = "Sisoul daemon client SDK"
license = "MIT"
repository = "https://github.com/sisoul/sisoul-client-rust"
keywords = ["sisoul", "did", "vault"]
categories = ["api-bindings"]

[features]
default = ["blocking"]
blocking = ["reqwest/blocking"]
async = []

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = "2"

[dev-dependencies]
mockito = "1.4"
tokio = { version = "1", features = ["macros", "rt"] }
