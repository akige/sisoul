[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sisoul-client"
version = "0.1.0"
description = "Sisoul daemon client SDK - Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sisoul" }]
keywords = ["sisoul", "did", "self-sovereign", "vault", "skills"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["sisoul_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
