# sisoul tox configuration - cross-Python version testing.
# Use: tox -e py312 (or just `tox` for default)

[tox]
envlist = py311, py312, lint, security
isolated_build = true
skip_missing_interpreters = true

[testenv]
deps =
    pytest>=8.0
    pytest-cov>=4.1
    pytest-asyncio>=0.23
    httpx>=0.27
extras = dev,daemon,llm,chat
commands =
    pytest tests -q --tb=line \
        --ignore=tests/test_v1_integration_full_user_journey.py \
        --cov=sisoul --cov-report=term-missing

[testenv:lint]
deps =
    ruff>=0.4
    mypy>=1.8
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/
    mypy src/sisoul --ignore-missing-imports

[testenv:security]
deps =
    pip-audit>=2.7
    bandit>=1.7
commands =
    pip-audit --strict
    bandit -r src/sisoul -ll

[testenv:docs]
deps =
    mkdocs>=1.5
    mkdocs-material>=9.5
commands =
    mkdocs build --strict

[pytest]
testpaths = tests
asyncio_mode = auto

[coverage:run]
source = src/sisoul
omit =
    */tests/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if TYPE_CHECKING
    if __name__ == .__main__.:
