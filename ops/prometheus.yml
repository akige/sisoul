# Prometheus scrape config for sisoul docker-compose stack.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: sisoul
    static_configs:
      - targets: ["sisoul:9876"]
    metrics_path: /sisoul/metrics
    scrape_interval: 30s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
